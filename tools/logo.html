<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Favicon source</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  /* Keep this markup in sync with /favicon.svg. */
  svg { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
      <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#221c44"/>
        <stop offset="0.34" stop-color="#4b3260"/>
        <stop offset="0.66" stop-color="#a05c6b"/>
        <stop offset="1" stop-color="#e8a45e"/>
      </linearGradient>
    </defs>

    <rect width="512" height="512" fill="url(#dusk)"/>

    <!-- Dial plus a drip that slides off to one side: the asymmetry is what
         keeps it reading as a melting clock rather than a map pin. -->
    <circle cx="256" cy="256" r="170" fill="#f9f1dd"/>
    <circle cx="256" cy="256" r="142" fill="none" stroke="#c2a67c" stroke-width="9" opacity="0.55"/>

    <g stroke="#2b2013" stroke-width="19" stroke-linecap="round">
      <line x1="256" y1="102" x2="256" y2="134"/>
      <line x1="410" y1="256" x2="378" y2="256"/>
      <line x1="256" y1="410" x2="256" y2="378"/>
      <line x1="102" y1="256" x2="134" y2="256"/>
    </g>

    <!-- the hands sag: the Dalí reference the melt can't carry at 16px -->
    <g stroke="#2b2013" stroke-width="24" stroke-linecap="round" fill="none">
      <path d="M256 256 C 222 230, 192 212, 164 202"/>
      <path d="M256 256 C 274 294, 286 330, 278 362"/>
    </g>
    <circle cx="256" cy="256" r="22" fill="#2b2013"/>
  </svg>
</body>
</html>
